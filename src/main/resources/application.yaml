spring:
  application:
    name: shelly-cloud-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/shelly"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

shelly:
  cloud:
    host: 10.78.30.20
    token: dummy-token

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6008
management:
  server:
    port: 8008

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
